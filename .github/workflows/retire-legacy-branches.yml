name: Retire obsolete legacy branches

on:
  push:
    branches: [refactoring-codex]
    paths: [.github/workflows/retire-legacy-branches.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    if: github.ref == 'refs/heads/refactoring-codex'
    runs-on: windows-latest
    steps:
      - name: Verify original heads, then delete only the two requested refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $targets = @(
            @{ Name = 'release/7.1.0'; Sha = 'b9d5cdcff80c4137590745c5a47a54911cbdfe4e' },
            @{ Name = 'feature/FirstRun'; Sha = 'a5d004b8e9717915e6f5174bae06ed988cf423cb' }
          )
          foreach ($target in $targets) {
            $actual = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$($target.Name)" --jq .object.sha
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect $($target.Name); nothing will be deleted." }
            if ($actual -ne $target.Sha) { throw "Head changed for $($target.Name); nothing will be deleted." }
          }
          foreach ($target in $targets) {
            gh api --silent --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$($target.Name)"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete $($target.Name)." }
            Write-Output "Deleted $($target.Name) at $($target.Sha)"
          }
